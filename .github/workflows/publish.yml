name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [major, minor, patch]
        default: patch
        required: true
      tag:
        description: npm dist-tag
        type: choice
        options: [latest, default, alpha, demo]
        default: latest
        required: true
      provenance:
        description: Publish with provenance
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$TAG" = "latest" ]; then
            # Stable release (a prerelease graduates, e.g. 0.0.2-beta.1 -> 0.0.2).
            npm version "$BUMP" --no-git-tag-version
          elif [[ "$current" == *-* ]]; then
            # Already a prerelease: 0.0.2-beta.0 -> 0.0.2-beta.1 (or switches the id).
            npm version prerelease --preid "$TAG" --no-git-tag-version
          else
            # First prerelease of the bump: 0.0.1 -> 0.0.2-beta.0
            npm version "pre$BUMP" --preid "$TAG" --no-git-tag-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # Authenticates with GitHub OIDC (id-token: write); no npm token needed.
        env:
          TAG: ${{ inputs.tag }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          args=(--tag "$TAG" --access public)
          if [ "$PROVENANCE" = "true" ]; then args+=(--provenance); fi
          npm publish "${args[@]}"

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          url="https://www.npmjs.com/package/$name/v/$VERSION"
          args=()
          if [ "$TAG" != "latest" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
            --notes "Published to npm: $url" "${args[@]}"
