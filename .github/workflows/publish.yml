name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [major, minor, patch]
        default: patch
        required: true
      tag:
        description: npm dist-tag
        type: choice
        options: [latest, default, alpha, demo]
        default: latest
        required: true
      provenance:
        description: Publish with provenance
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # Authenticates with GitHub OIDC (id-token: write); no npm token needed.
        env:
          TAG: ${{ inputs.tag }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          args=(--tag "$TAG" --access public)
          if [ "$PROVENANCE" = "true" ]; then args+=(--provenance); fi
          npm publish "${args[@]}"

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
