name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish JSON schema
        run: cp schema/values.schema.json sites/schema.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites
      - id: deployment
        uses: actions/deploy-pages@v4
