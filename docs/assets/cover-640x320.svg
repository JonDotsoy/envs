<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
<title>envs: one file for every worktree's .env</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF"/>
<stop offset="1" stop-color="#F1EFE8"/>
</linearGradient>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.m{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}
.s{font-family:'DejaVu Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
</style>
<rect width="640" height="320" fill="url(#bg)"/>

<!-- Left: title block (safe zone 40..600 x 40..280) -->
<text class="m" x="42" y="72" font-size="14" fill="#534AB7">@jondotsoy/envs</text>
<text class="s" x="40" y="146" font-size="78" font-weight="700" fill="#1F1F1D" letter-spacing="-2">envs</text>
<g class="s" font-size="21" fill="#444441">
<text x="41" y="182">One file for every</text>
<text x="41" y="208">worktree's <tspan class="m" fill="#0F6E56" font-weight="700">.env</tspan></text>
</g>

<rect x="40" y="226" width="246" height="42" rx="8" fill="#1F1F1D"/>
<circle cx="52" cy="235" r="2.5" fill="#E24B4A"/><circle cx="60" cy="235" r="2.5" fill="#EF9F27"/><circle cx="68" cy="235" r="2.5" fill="#639922"/>
<text class="m" x="50" y="257" font-size="12.5"><tspan fill="#5DCAA5">$</tspan><tspan fill="#F1EFE8" dx="7.5">bunx @jondotsoy/envs edit</tspan></text>

<!-- Right: branch .env cards -->
<g>
<rect x="312" y="48" width="122" height="60" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="s" x="322" y="65" font-size="13" font-weight="700" fill="#085041" dominant-baseline="central">main</text>
<line x1="320" y1="78" x2="426" y2="78" stroke="#0F6E56" stroke-opacity="0.35"/>
<text class="m" x="322" y="93" font-size="11" font-weight="700" fill="#0F6E56">.env</text>
<rect x="356" y="88" width="50" height="5" rx="2.5" fill="#0F6E56" fill-opacity="0.45"/>
<rect x="322" y="99" width="62" height="5" rx="2.5" fill="#0F6E56" fill-opacity="0.45"/>
</g>
<g>
<rect x="312" y="130" width="122" height="60" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="s" x="322" y="147" font-size="13" font-weight="700" fill="#3C3489" dominant-baseline="central">feature/biz</text>
<line x1="320" y1="160" x2="426" y2="160" stroke="#534AB7" stroke-opacity="0.35"/>
<text class="m" x="322" y="175" font-size="11" font-weight="700" fill="#534AB7">.env</text>
<rect x="356" y="170" width="58" height="5" rx="2.5" fill="#534AB7" fill-opacity="0.45"/>
<rect x="322" y="181" width="70" height="5" rx="2.5" fill="#534AB7" fill-opacity="0.45"/>
</g>
<g>
<rect x="312" y="212" width="122" height="60" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="s" x="322" y="229" font-size="13" font-weight="700" fill="#712B13" dominant-baseline="central">fix/tar</text>
<line x1="320" y1="242" x2="426" y2="242" stroke="#993C1D" stroke-opacity="0.35"/>
<text class="m" x="322" y="257" font-size="11" font-weight="700" fill="#993C1D">.env</text>
<rect x="356" y="252" width="44" height="5" rx="2.5" fill="#993C1D" fill-opacity="0.45"/>
<rect x="322" y="263" width="66" height="5" rx="2.5" fill="#993C1D" fill-opacity="0.45"/>
</g>

<!-- Arrows (pull / push) -->
<g fill="none" stroke-width="1.8" stroke-linecap="round">
<path d="M440 78 C 460 78, 456 112, 474 116" stroke="#1D9E75" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M440 160 L 474 160" stroke="#7F77DD" marker-start="url(#av)" marker-end="url(#av)"/>
<path d="M440 242 C 460 242, 456 208, 474 204" stroke="#D85A30" marker-start="url(#ac)" marker-end="url(#ac)"/>
</g>

<!-- Center: values.yml -->
<rect x="480" y="88" width="119" height="144" rx="8" fill="#FFFFFF" stroke="#1F1F1D" stroke-width="1.5"/>
<text class="m" x="490" y="108" font-size="12" font-weight="700" fill="#1F1F1D">values.yml</text>
<line x1="480" y1="118" x2="599" y2="118" stroke="#1F1F1D" stroke-opacity="0.25"/>
<g class="m" font-size="11" font-weight="700">
<text x="490" y="137" fill="#0F6E56">main:</text>
<text x="490" y="173" fill="#534AB7">feature/biz:</text>
<text x="490" y="209" fill="#993C1D">fix/tar:</text>
</g>
<g fill="#888780" fill-opacity="0.5">
<rect x="498" y="144" width="80" height="5" rx="2.5"/>
<rect x="498" y="180" width="88" height="5" rx="2.5"/>
<rect x="498" y="216" width="80" height="5" rx="2.5"/>
</g>
</svg>
