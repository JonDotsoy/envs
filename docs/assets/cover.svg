<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>envs: one file for every worktree's .env</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF"/>
<stop offset="1" stop-color="#F1EFE8"/>
</linearGradient>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.m{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}
.s{font-family:'DejaVu Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
</style>
<rect width="1280" height="640" fill="url(#bg)"/>

<!-- Left: title block (safe zone 80..1200 x 80..560) -->
<text class="m" x="84" y="140" font-size="24" fill="#534AB7">@jondotsoy/envs</text>
<text class="s" x="80" y="282" font-size="150" font-weight="700" fill="#1F1F1D" letter-spacing="-4">envs</text>
<g class="s" font-size="40" fill="#444441">
<text x="82" y="352">One file for every</text>
<text x="82" y="402">worktree's <tspan class="m" fill="#0F6E56" font-weight="700">.env</tspan></text>
</g>

<rect x="80" y="448" width="484" height="72" rx="12" fill="#1F1F1D"/>
<circle cx="104" cy="464" r="4" fill="#E24B4A"/><circle cx="118" cy="464" r="4" fill="#EF9F27"/><circle cx="132" cy="464" r="4" fill="#639922"/>
<text class="m" x="104" y="500" font-size="22" xml:space="preserve"><tspan fill="#5DCAA5">$ </tspan><tspan fill="#F1EFE8">bunx @jondotsoy/envs edit</tspan></text>

<!-- Right: branch .env cards -->
<g>
<rect x="620" y="100" width="236" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="642" cy="126" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="s" x="656" y="126" font-size="20" font-weight="700" fill="#085041" dominant-baseline="central">main</text>
<text class="m" x="840" y="126" font-size="16" fill="#0F6E56" text-anchor="end" dominant-baseline="central">.env</text>
<line x1="636" y1="148" x2="840" y2="148" stroke="#0F6E56" stroke-opacity="0.35"/>
<g class="m" font-size="15" fill="#085041"><text x="636" y="176">NODE_ENV=production</text><text x="636" y="200">API_URL=api.acme.io</text></g>
</g>
<g>
<rect x="620" y="260" width="236" height="120" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<circle cx="642" cy="286" r="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="s" x="656" y="286" font-size="20" font-weight="700" fill="#3C3489" dominant-baseline="central">feature/biz</text>
<text class="m" x="840" y="286" font-size="16" fill="#534AB7" text-anchor="end" dominant-baseline="central">.env</text>
<line x1="636" y1="308" x2="840" y2="308" stroke="#534AB7" stroke-opacity="0.35"/>
<g class="m" font-size="15" fill="#3C3489"><text x="636" y="336">NODE_ENV=development</text><text x="636" y="360">API_URL=biz.acme.dev</text></g>
</g>
<g>
<rect x="620" y="420" width="236" height="120" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<circle cx="642" cy="446" r="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="s" x="656" y="446" font-size="20" font-weight="700" fill="#712B13" dominant-baseline="central">fix/tar</text>
<text class="m" x="840" y="446" font-size="16" fill="#993C1D" text-anchor="end" dominant-baseline="central">.env</text>
<line x1="636" y1="468" x2="840" y2="468" stroke="#993C1D" stroke-opacity="0.35"/>
<g class="m" font-size="15" fill="#712B13"><text x="636" y="496">NODE_ENV=staging</text><text x="636" y="520">API_URL=tar.acme.dev</text></g>
</g>

<!-- Arrows (pull / push) -->
<g fill="none" stroke-width="2.5" stroke-linecap="round">
<path d="M866 160 C 910 160, 900 230, 944 236" stroke="#1D9E75" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M866 320 L 944 320" stroke="#7F77DD" marker-start="url(#av)" marker-end="url(#av)"/>
<path d="M866 480 C 910 480, 900 410, 944 404" stroke="#D85A30" marker-start="url(#ac)" marker-end="url(#ac)"/>
</g>

<!-- Center: values.yml -->
<rect x="952" y="170" width="246" height="300" rx="12" fill="#FFFFFF" stroke="#1F1F1D" stroke-width="2"/>
<text class="m" x="972" y="204" font-size="18" font-weight="700" fill="#1F1F1D">values.yml</text>
<text class="m" x="1182" y="204" font-size="13" fill="#888780" text-anchor="end">.envs/</text>
<line x1="952" y1="222" x2="1198" y2="222" stroke="#1F1F1D" stroke-opacity="0.25"/>
<g class="m" font-size="15">
<text x="972" y="256" fill="#0F6E56" font-weight="700">main:</text>
<text x="990" y="280" fill="#444441">API_URL: api.acme.io</text>
<text x="972" y="320" fill="#534AB7" font-weight="700">feature/biz:</text>
<text x="990" y="344" fill="#444441">API_URL: biz.acme.dev</text>
<text x="972" y="384" fill="#993C1D" font-weight="700">fix/tar:</text>
<text x="990" y="408" fill="#444441">API_URL: tar.acme.dev</text>
<text x="990" y="444" fill="#888780">…</text>
</g>
</svg>
